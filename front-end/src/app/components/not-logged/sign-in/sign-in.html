<div id="sign-in-container">
    <div class="row justify-content-center">
        <div class="login-box p-4">
            <h1 class="mb-4">Entre na sua conta</h1>

            <form >
                <div class="mb-3">
                    <input type="text"
                            class="form-control custom-input"
                            placeholder="E-mail ou Número de Telefone"
                            type="email">
                </div>

                <div class=""mb-3>
                    <input
                        type="password"
                        class="form-control custom-input"
                        placeholder="Sua senha">
                </div>

                <button type="submit" class="btn btn-danger w-100 custom-button mb-3">
                    Entrar na conta
                </button>

                <div class="text-center mb-4">
                    <a href="/cadastro" class="text-white text-decoration-none forgot-password">
                        Esqueci minha senha
                    </a>
                </div>

                <div class="text-center new-here">
                    <span class="text-white">Novo por aqui?</span>
                    <a href="/cadastro" class="text-danger text-decoration-none ms-2">
                        Assine agora
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
